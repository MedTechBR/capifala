<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>CapiFala</title>
<meta name="robots" content="noindex">
<meta name="description" content="Curso de inglês para brasileiros em lições curtas.">
<meta name="theme-color" content="#5145D6">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CapiFala">
<link rel="stylesheet" href="estilo.css?v=2">
</head>
<body>
<div id="app">
  <aside id="lateral"></aside>
  <main id="principal"></main>
  <aside id="painel"></aside>
  <nav id="barra" aria-label="Navegação principal"></nav>
</div>
<div id="camada"></div>
<div id="avisos" aria-live="polite"></div>
<script src="curso.js?v=2"></script>
<script src="curso2.js?v=2"></script>
<script src="audio/indice.js?v=2"></script>
<script src="motor.js?v=2"></script>
<script src="app.js?v=2"></script>
<script>
/* Se um arquivo do app não chegou, avisa em vez de deixar a tela de login girando para sempre. */
window.addEventListener('load', function () {
  if (window.CURSO && window.Motor && window.CapiFala) return;
  document.querySelectorAll('#mtsPortao').forEach(function (x) { x.remove(); });
  var av = document.createElement('div'); av.id = 'mtsPortao';
  av.innerHTML = '<div class="mts-cx"><h1>Não consegui abrir o CapiFala</h1><p class="sub">Parte do aplicativo não carregou. Confira a internet e tente de novo.</p><button class="bt" onclick="location.reload()">Tentar de novo</button></div>';
  document.body.appendChild(av);
});
</script>
</body>
</html>
